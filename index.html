<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frinks Vision · Access v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --p:#ff4301; --p90:rgba(255,67,1,.9); --light:#fdece5; --flat:#fadbce;
  --g50:#f9fafb; --g100:#f3f4f6; --g200:#e5e7eb; --g300:#d1d5db; --g400:#9ca3af; --g500:#6b7280; --g600:#4b5563; --g700:#374151; --g800:#1f2937; --g900:#111827;
  --side:#1e1c1c; --dl:#E3E5E5; --red:#ef4444; --green:#22c55e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Outfit',sans-serif;color:#000;background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}

/* ---------- main sidebar (350px, #1e1c1c) ---------- */
.side{position:fixed;left:0;top:0;bottom:0;width:350px;background:var(--side);border-right:1px solid var(--g300);display:flex;flex-direction:column;align-items:stretch;padding:24px 0 16px 20px;color:#fff;z-index:20}
.logo{display:block;padding:8px 8px 0;font-size:30px;font-weight:600;letter-spacing:-.01em}
.logo b{color:var(--p)}
.menu{list-style:none;margin:32px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;margin-right:24px;padding:8px;border-radius:6px;cursor:pointer;font-size:18px;color:#fff;transition:background .3s}
.mi:hover{background:rgba(255,255,255,.1)}
.mi.active{background:rgba(255,255,255,.2)}
.mi .ic{width:32px;display:flex;justify-content:center;flex:none}
.mi .t{margin-left:16px}
.subm{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column;gap:6px}
.subm .mi{padding-left:56px}
.who{margin-top:auto;margin-right:20px;position:relative}
.whob{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.12)}
.whob:hover{background:rgba(255,255,255,.08)}
.av{width:34px;height:34px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.whob .nm{font-size:15px;font-weight:500}
.whob .rl{font-size:12px;color:#bdbdbd;line-height:1.3}
.whomenu{position:absolute;bottom:64px;left:0;right:0;background:#fff;color:#111;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);max-height:70vh;overflow:auto;padding:6px}
.whomenu .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);padding:8px 10px 4px}
.whomenu .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.whomenu .it:hover{background:var(--g100)}
.whomenu .it.on{background:var(--light)}
.whomenu .it .av{width:28px;height:28px;font-size:10px}
.whomenu .it small{display:block;color:var(--g500);font-size:12px;line-height:1.3}

/* ---------- project rail (80px) ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:80px;background:var(--side);border-right:1px solid var(--g300);display:flex;flex-direction:column;align-items:center;padding:24px 8px;z-index:20}
.rail .lg{color:#fff;font-weight:700;font-size:20px;margin:12px 0 40px;cursor:pointer}
.rail .lg b{color:var(--p)}
.rail ul{list-style:none;margin:32px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%}
.rail li{position:relative}
.rail .ri{display:flex;justify-content:center;padding:8px 0;border-radius:6px;color:#fff;cursor:pointer}
.rail .ri:hover,.rail .ri.active{background:rgba(255,255,255,.2)}
.rail .tip{position:absolute;left:100%;top:50%;transform:translate(-4px,-50%);margin-left:12px;padding:6px 10px;font-size:12px;font-weight:600;color:#fff;background:var(--p);border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:.25s}
.rail li:hover .tip{opacity:1;transform:translate(0,-50%)}
.rail .bottom{margin-top:auto;width:100%}

/* ---------- page ---------- */
.main{margin-left:350px;min-height:100%}
.main.proj{margin-left:80px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;height:60px;margin-top:4px;padding:16px 20px;background:#fff}
.heading .t{font-size:30px;font-weight:500}
.heading .acts{display:flex;align-items:center;gap:12px}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--g500)}
.crumb span{padding:4px 8px;border-radius:6px;font-weight:500;color:var(--g600)}
.crumb span.cur{font-weight:600;color:var(--g900)}
.crumb span.lnk{cursor:pointer}
.crumb span.lnk:hover{color:var(--p);background:var(--g100)}
.pad{padding:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 14px}
.bar .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{font-weight:600;font-size:14px;padding:8px 24px;border-radius:6px;cursor:pointer;border:1px solid transparent;background:var(--p);color:#fff;line-height:20px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--p90)}
.btn.md{padding:6px 16px}
.btn.ssm{font-size:12px;padding:4px 8px}
.btn.bd{background:transparent;border-color:var(--p);color:var(--p)}
.btn.bd:hover{opacity:.7}
.btn.light{background:#F6F6FF;color:var(--p)}
.btn:disabled{background:var(--g200);color:var(--g500);border-color:transparent;cursor:not-allowed;opacity:1}
.btn.ghost{background:transparent;color:var(--g700);border-color:var(--g300)}

/* table (orange header like Table.tsx) */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:720px}
table.t thead tr{background:var(--p)}
table.t th{color:#fff;font-weight:500;font-size:16px;padding:16px 8px;text-align:center;position:relative;white-space:nowrap}
table.t th:not(:last-child)::after{content:"";position:absolute;right:0;top:10px;bottom:10px;width:2px;border-radius:16px;background:#fff}
table.t td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--g200);font-size:15px;color:#000}
table.t tr.dim td{color:var(--g400)}
.empty{padding:28px;text-align:center;font-size:18px;font-weight:600}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,67,1,.1);color:var(--p);border:1px solid rgba(255,67,1,.2);font-size:12.5px;font-weight:500;margin:2px;white-space:nowrap}
.chip.adm{background:var(--p);color:#fff;border-color:var(--p)}
.chip.cus{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe}
.chip.gray{background:var(--g100);color:var(--g600);border-color:var(--g200)}
.st{font-size:13px;font-weight:600}
.st.Active{color:#16a34a}.st.Invited{color:#d97706}.st.Inactive{color:var(--g400)}
.ia{display:inline-flex;gap:6px;justify-content:center;align-items:center}
.ib{width:30px;height:30px;border-radius:6px;display:inline-grid;place-items:center;cursor:pointer;color:var(--g700)}
.ib:hover{background:var(--g100)}
.ib.red{color:var(--red)}
.link{color:var(--p);text-decoration:underline;font-weight:500;cursor:pointer}

/* dots menu */
.dd{position:relative;display:inline-block}
.ddm{position:absolute;right:30px;top:0;z-index:40;background:#fff;border:1px solid var(--g200);border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.12);list-style:none;margin:0;padding:4px 0;min-width:150px;text-align:left}
.ddm li{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.ddm li:hover{background:var(--g100)}
.ddm li.red{color:var(--red)}

/* project cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px;margin-top:8px}
.card{position:relative;min-height:160px;border:1px solid var(--g200);border-radius:8px;background:#fff;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:space-between;overflow:visible;transition:all .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.card .top{display:flex;gap:16px;padding-right:24px}
.card .ico{width:48px;height:48px;border-radius:16px;background:var(--light);color:var(--p);display:grid;place-items:center;flex:none}
.card h3{margin:0;font-size:16px;font-weight:600;color:var(--g900);padding-top:4px}
.card:hover h3{color:var(--p)}
.card .desc{margin-top:6px;font-size:14px;color:var(--g500);line-height:1.35}
.card .bot{margin-top:24px;padding-top:16px;display:flex;justify-content:space-between;align-items:center}
.card .by{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--g800)}
.card .by .av{width:32px;height:32px;font-size:11px}
.card .dt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--g500)}
.card .dt i{width:6px;height:6px;border-radius:50%;background:var(--p)}
.card .mem{font-size:12px;color:var(--g500);margin-top:8px}
.card .menu3{position:absolute;right:14px;top:14px;opacity:0;transition:.2s}
.card:hover .menu3,.card .menu3.open{opacity:1}
.card .ov{position:absolute;inset:auto 0 0 0;height:96px;display:flex;align-items:center;justify-content:center;gap:12px;padding:24px 24px 8px;background:linear-gradient(to top,#fff,rgba(255,255,255,.95),transparent);opacity:0;transform:translateY(20px);transition:.3s;border-radius:0 0 8px 8px}
.card:hover .ov{opacity:1;transform:none}
.card .ov .btn{flex:1;justify-content:center}
.create{min-height:160px;border:2px dashed var(--g300);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:.3s}
.create:hover{border-color:rgba(255,67,1,.5);background:rgba(249,250,251,.5);box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
.create .pl{width:52px;height:52px;border-radius:14px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:300;margin-bottom:16px}
.create h3{margin:0;font-size:16px;font-weight:700;color:var(--g900)}
.create p{margin:4px 0 0;font-size:14px;font-weight:500;color:var(--g500)}
.noacc{display:flex;gap:12px;align-items:center;width:fit-content;border-radius:8px;padding:12px 20px 12px 12px;font-size:16px;font-weight:600;box-shadow:3px 3px 5px #00000020;margin:20px}

/* drawer (shared/ui/Drawer) */
.bk{position:fixed;inset:0;background:rgba(180,182,184,.5);z-index:60}
.dr{position:fixed;top:0;right:0;height:100%;width:100%;background:#fff;z-index:61;display:flex;flex-direction:column}
.dr.xs{max-width:512px}.dr.md{max-width:768px}.dr.xl{max-width:1100px}
.dr .dh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--g200);padding:12px 16px 8px;height:50px;font-size:18px;font-weight:600}
.dr .dh .x{cursor:pointer;padding:2px 6px}
.dr .db{flex:1;overflow-y:auto;padding:8px 14px 24px}
.dr .df{display:flex;justify-content:flex-end;gap:16px;align-items:center;border-top:1px solid var(--g200);padding:16px;min-height:80px}
.dr .df .grow{flex:1;font-size:13px;color:var(--g500)}
.form{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.lb{display:block;font-size:14px;margin-bottom:4px;color:#000}
.lb .rq{color:var(--red)}
.in,.sel{width:100%;border:1px solid var(--g300);border-radius:6px;padding:8px 12px;font-size:14px;outline:none;background:#fff;color:#000}
.in:focus,.sel:focus{border-color:var(--p);outline:2px solid var(--p);outline-offset:-1px}
.sel:disabled,.in:disabled{background:var(--g100);color:var(--g500)}
.err{font-size:12px;color:var(--red);margin-top:4px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--g200);border-radius:6px;min-height:42px;align-items:center}
.chips .chip{font-size:14px}
.chips input{border:none;outline:none;flex:1;min-width:140px;font-size:14px;padding:4px}
.sec{border-top:4px solid var(--dl);margin:8px -14px 0;padding:16px 14px 0}
.sec h4{margin:0;font-size:16px;font-weight:600}
.sec .sub{font-size:13px;color:var(--g500);margin-top:2px}
.ulist{border:1px solid var(--g200);border-radius:8px;max-height:340px;overflow-y:auto;margin-top:10px}
.urow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--g100);cursor:pointer}
.urow:last-child{border-bottom:none}
.urow:hover{background:var(--g50)}
.urow.lock{cursor:default;background:var(--g50)}
.urow .nm{font-weight:500;font-size:14px}
.urow .pl{font-size:12px;color:var(--g500)}
.urow .rs{margin-left:auto;text-align:right;max-width:55%}
.filters{display:flex;gap:8px;margin-top:10px}
.filters .sel,.filters .in{width:auto;flex:1}

/* checkbox (ThreeStateCheckbox look) */
.cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--g400);background:#fff;display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:.2s}
.cb svg{width:16px;height:16px;opacity:0}
.cb.on{background:var(--p);border-color:var(--p)}
.cb.on svg{opacity:1}
.cb.dis{cursor:not-allowed;opacity:.55}
.cb.dis.on{background:var(--g400);border-color:var(--g400)}
.cb.big{width:28px;height:28px}
.cb.big svg{width:22px;height:22px}

/* role picker */
.rgroup{margin-top:10px}
.rgroup .gh{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);font-weight:600;margin:6px 0}
.ropt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--g200);border-radius:8px;margin-bottom:6px;cursor:pointer}
.ropt:hover{background:var(--g50)}
.ropt.on{border-color:var(--p);background:#fff7f3}
.ropt.dis{cursor:not-allowed;opacity:.5}
.ropt .rn{font-size:14px;font-weight:500}
.ropt .rd{font-size:12px;color:var(--g500);line-height:1.3}

/* role drawer (CreateRoleDrawer) */
.rov{position:fixed;inset:0;background:#00000080;z-index:60;display:flex;justify-content:flex-end}
.rdr{height:100vh;width:min(1280px,calc(100vw - 60px));background:#fff;display:flex;flex-direction:column}
.rdr .h{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--dl);padding:0 20px;font-size:18px;font-weight:600}
.rdr .b{flex:1;display:flex;min-height:0}
.rdr .stp{width:260px;flex:none;border-right:2px solid var(--dl);display:flex;align-items:center;justify-content:center}
.vs .s{display:flex;align-items:flex-start}
.vs .c{display:flex;flex-direction:column;align-items:center}
.vs .d{margin:10px 0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.vs .d.cur,.vs .d.done{background:var(--p)}
.vs .d.todo{border:2px solid var(--g400)}
.vs .ln{height:100px;width:2px;background:var(--g300)}
.vs .ln.done{background:var(--p)}
.vs .lb2{margin:10px 0 0 16px;width:150px;font-size:18px;color:var(--g500);cursor:pointer}
.vs .lb2.cur{font-weight:700;color:#000}
.rdr .ct{flex:1;overflow-y:auto;min-width:0}
.rdr .f{min-height:64px;display:flex;justify-content:space-between;align-items:center;border-top:4px solid var(--dl);padding:0 16px 0 276px}
.rdr .f .l{display:flex;gap:16px;align-items:center}
.basic{display:flex;flex-direction:column;gap:16px;padding:40px 80px 40px 40px}
.basic .hh{font-size:30px;font-weight:700}
.basic .pp{font-size:20px}
.basic .fld{padding:0 12px}
.basic .fld .lb{font-size:18px;font-weight:500;margin-bottom:8px}
.basic .in{font-size:16px;padding:12px 14px;border-radius:8px}
.perm{margin:16px;border-radius:8px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);padding:16px}
.perm h2{margin:0 0 6px;font-size:20px;font-weight:700}
.perm .ds{margin:0 0 20px;font-size:16px}
.gh2{position:sticky;top:0;z-index:2;display:flex;background:#fff;border-bottom:2px solid var(--g200);padding:0 16px 6px 18px;margin-bottom:6px}
.gh2 .r{flex:1;font-size:18px;font-weight:700}
.gh2 .c{width:110px;text-align:center;font-size:18px;font-weight:700}
.prow{display:flex;align-items:center;padding:10px 16px;border-radius:8px}
.prow:hover{background:var(--g100)}
.prow .r{flex:1;min-width:0}
.prow .r b{font-weight:600}
.prow .r small{display:block;color:var(--g500);font-size:13px}
.prow .c{width:110px;display:flex;justify-content:center}
.prow.sp{padding-top:2px;padding-bottom:12px}
.swl{display:flex;align-items:center;gap:12px;padding-left:24px;font-size:14px;color:var(--g700)}
.sw{width:40px;height:22px;border-radius:22px;background:var(--g300);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--p)}
.sw.on::after{transform:translateX(18px)}
.sw.dis{cursor:not-allowed;opacity:.5}
.scope{margin:16px;border:1px solid var(--g200);border-radius:8px;padding:16px 20px}
.scope h3{margin:0 0 8px;font-size:18px}
.scope ul{margin:0;padding-left:20px;line-height:1.9}

/* org tree */
.tree td:first-child{text-align:left;padding-left:16px}
.tree .lv1 td:first-child{padding-left:16px;font-weight:600}
.tree .lv2 td:first-child{padding-left:52px}
.tree .lv3 td:first-child{padding-left:88px;color:var(--g700)}
.tree .chev{display:inline-block;width:18px;cursor:pointer;color:var(--g500);transition:transform .15s}
.tree .chev.closed{transform:rotate(-90deg)}
.tree .lvl{font-size:12px;color:var(--g500);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.tree tr.lv1{background:#fff8f5}

/* modal */
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:grid;place-items:center}
.mdl{background:#fff;border-radius:10px;width:min(520px,92vw);box-shadow:0 20px 40px rgba(0,0,0,.2)}
.mdl .mh{display:flex;justify-content:space-between;padding:16px 20px;font-size:18px;font-weight:600;border-bottom:1px solid var(--g200)}
.mdl .mb{padding:20px;font-size:15px}
.mdl .mf{display:flex;justify-content:flex-end;gap:12px;padding:12px 20px 18px}

/* toast (react-hot-toast) */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#fff;color:#363636;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);padding:8px 12px;border-radius:8px;font-size:14px;z-index:99;display:flex;gap:10px;align-items:center;max-width:520px}
.toast i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;flex:none}
.toast i.ok{background:#61d345}.toast i.no{background:#ff4b4b}

/* misc pages */
.stub{margin:20px;border:1px solid var(--g200);border-radius:8px;padding:24px;max-width:720px}
.stub h3{margin:0 0 6px}
.k{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--g100);font-size:12px;color:var(--g600)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ======================= ICONS ======================= */
const I={

const subN=id=>id?(D.subs.find(x=>x.id===id)||{}).name:'—';
const initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

function adminLevel(u){let best=null;u.roles.forEach(r=>{const l=(R(r)||{}).level;if(l&&(!best||{org:3,plant:2,div:1}[l]>{org:3,plant:2,div:1}[best]))best=l;});return best;}
const isAdmin=u=>!!adminLevel(u);
function rolePerms(r){if(r.kind==='builtin'){const ar=AREAS.find(a=>a.id===r.area);return mkPerms({[ar.id]:ar.cols},ar.specials.map(s=>s.id));}return r.perms||viewOnlyPerms();}
function perms(u){
  if(isAdmin(u)) return mkPerms(Object.fromEntries(AREAS.map(a=>[a.id,a.cols])),ALL_SPECIALS.map(s=>s.id));
  const out=viewOnlyPerms();
  u.roles.forEach(id=>{const r=R(id);if(!r)return;const p=rolePerms(r);AREAS.forEach(a=>a.cols.forEach(c=>{if(p.areas[a.id][c])out.areas[a.id][c]=true}));ALL_SPECIALS.forEach(s=>{if(p.specials[s.id])out.specials[s.id]=true})});
  return out;
}
const can=(area,col,u=me())=>!!perms(u).areas[area][col];
const canS=(sid,u=me())=>!!perms(u).specials[sid];
function scope(u){const l=adminLevel(u);if(l==='org')return {};if(l==='plant')return {plant:u.plant};if(l==='div')return {plant:u.plant,div:u.div};return {plant:u.plant,div:u.div,sub:u.sub};}
function instVisible(inst,u=me()){const s=scope(u);for(const k of ['plant','div','sub']){if(s[k]&&inst[k]&&s[k]!==inst[k])return false;}return true;}
function projVisible(p,u=me()){return isAdmin(u)||p.members.includes(u.id);}
function userInScope(t,u=me()){const l=adminLevel(u);if(l==='org')return true;if(l==='plant')return t.plant===u.plant;if(l==='div')return t.plant===u.plant&&t.div===u.div;return false;}
function canEditUser(t,u=me()){if(!isAdmin(u)||!userInScope(t,u))return false;const tl=adminLevel(t);if(!tl)return true;const rk={org:3,plant:2,div:1};return rk[tl]<=rk[adminLevel(u)];}
function assignable(role,u=me()){const l=adminLevel(u);if(!l)return false;if(role.kind!=='admin')return true;const rk={org:3,plant:2,div:1};return rk[role.level]<=rk[l];}
function canManageAccess(p,u=me()){return isAdmin(u)||(p.members.includes(u.id)&&(can('project','edit',u)||p.createdBy===u.id));}
function canEditProject(p,u=me()){return isAdmin(u)||can('project','edit',u)||p.createdBy===u.id;}
function canDeleteProject(p,u=me()){return isAdmin(u)||can('project','delete',u)||p.createdBy===u.id;}
function canCreateProject(u=me()){return isAdmin(u)||can('project','create',u);}
function rolesLine(u){return u.roles.map(r=>(R(r)||{}).name).filter(Boolean).join(', ');}
function placement(u){if(adminLevel(u)==='org')return 'All plants';return [plantN(u.plant),u.div?divN(u.div):null,u.sub?subN(u.sub):null].filter(Boolean).join(' / ');}

/* ======================= ORG STRUCTURE ======================= */
function orgCaps(kind,obj){ // what me() can do on a node
  const u=me(),l=adminLevel(u);
  if(l==='org')return true;
  if(kind==='plant')return false; // only org admins add/rename/delete plants
  if(kind==='div'){return l==='plant'&&obj.plant===u.plant;}
  if(kind==='sub'){const d=D.divs.find(x=>x.id===obj.div);return (l==='plant'&&d.plant===u.plant)||(l==='div'&&obj.div===u.div);}
  return false;
}
function canAddInto(kind,obj){const u=me(),l=adminLevel(u);if(l==='org')return true;if(kind==='plant')return l==='plant'&&obj.id===u.plant;if(kind==='div')return (l==='plant'&&obj.plant===u.plant)||(l==='div'&&obj.id===u.div);return false;}
function countUsers(k,id){return D.users.filter(u=>u.status!=='Inactive'&&u[k]===id).length;}
function countInst(k,id){return D.projects.reduce((n,p)=>n+p.instances.filter(i=>i[k]===id).length,0);}
function pageOrg(){
  const l=adminLevel(me());
  const acts=(kind,obj,addLabel,addKind)=>`<div class="ia">${addKind&&canAddInto(kind,obj)?`<button class="btn ssm" data-a="addUnit" data-k="${addKind}" data-parent="${obj.id}">+ ${addLabel}</button>`:''}${orgCaps(kind,obj)?`<span class="ib" data-a="renUnit" data-k="${kind}" data-id="${obj.id}" title="Rename">${I.pen}</span><span class="ib red" data-a="delUnit" data-k="${kind}" data-id="${obj.id}" title="Delete">${I.trash}</span>`:''}</div>`;
  let rows='';
  D.plants.forEach(pl=>{
    const pc=S.closed['pl_'+pl.id];
    rows+=`<tr class="lv1"><td><span class="chev ${pc?'closed':''}" data-a="tog" data-id="pl_${pl.id}">${I.chev}</span> ${esc(pl.name)}</td><td class="lvl">Plant</td><td>${countUsers('plant',pl.id)}</td><td>${countInst('plant',pl.id)}</td><td>${acts('plant',pl,'Division','div')}</td></tr>`;
    if(pc)return;
    D.divs.filter(d=>d.plant===pl.id).forEach(d=>{
      const dc=S.closed['dv_'+d.id];
      rows+=`<tr class="lv2"><td><span class="chev ${dc?'closed':''}" data-a="tog" data-id="dv_${d.id}">${I.chev}</span> ${esc(d.name)}</td><td class="lvl">Division</td><td>${countUsers('div',d.id)}</td><td>${countInst('div',d.id)}</td><td>${acts('div',d,'Sub-division','sub')}</td></tr>`;
      if(dc)return;
      D.subs.filter(s=>s.div===d.id).forEach(s=>{rows+=`<tr class="lv3"><td>${esc(s.name)}</td><td class="lvl">Sub-division</td><td>${countUsers('sub',s.id)}</td><td>${countInst('sub',s.id)}</td><td>${acts('sub',s)}</td></tr>`;});
    });
  });
  return `<div class="heading"><div class="t">Plants &amp; Divisions</div><div class="acts">${l==='org'?`<button class="btn" data-a="addUnit" data-k="plant">Add Plant</button>`:''}</div></div><div class="pad"><div class="tw"><table class="t tree"><thead><tr><th style="text-align:left;padding-left:16px">Name</th><th>Level</th><th>Users</th><th>Instances</th><th style="width:300px">Actions</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ======================= USERS ======================= */
function pageUsers(){
  const u=me();const f=S.ufilter;
  const plantsInScope=adminLevel(u)==='org'?D.plants:D.plants.filter(p=>p.id===u.plant);
  let list=D.users.filter(t=>userInScope(t)||t.id===u.id);
  if(f.plant)list=list.filter(t=>t.plant===f.plant);
  if(f.q)list=list.filter(t=>(t.name+t.email).toLowerCase().includes(f.q.toLowerCase()));
  const rows=list.map(t=>{
    const mOpen=S.menu==='u_'+t.id;const ed=canEditUser(t);const items=[];
    if(ed)items.push(`<li data-a="editUser" data-id="${t.id}">${I.pen} Edit</li>`);
    if(ed&&t.id!==u.id)items.push(t.status==='Inactive'?`<li data-a="actUser" data-id="${t.id}">Activate</li>`:`<li class="red" data-a="deactUser" data-id="${t.id}">${I.trash} Deactivate</li>`);
    if(t.status==='Invited'&&ed)items.push(`<li data-a="stub" data-m="Invite re-sent to ${esc(t.email)}">Resend Invite</li>`);
    return `<tr class="${t.status==='Inactive'?'dim':''}"><td>${esc(t.name)}${t.id===u.id?' <span class="chip gray">You</span>':''}</td><td>${esc(t.email)}</td><td>${adminLevel(t)==='org'?'All':plantN(t.plant)}</td><td>${adminLevel(t)==='org'||adminLevel(t)==='plant'?'All':divN(t.div)}</td><td>${adminLevel(t)?'All':subN(t.sub)}</td><td style="max-width:260px">${t.roles.map(roleChip).join('')}</td><td><span class="st ${t.status}">${t.status}</span></td><td>${items.length?`<span class="dd"><span class="ib" data-a="menu" data-id="u_${t.id}">${I.dots}</span>${mOpen?`<ul class="ddm">${items.join('')}</ul>`:''}</span>`:''}</td></tr>`;
  }).join('');
  return `<div class="heading"><div class="t">Users</div><div class="acts"><button class="btn" data-a="newUser">Add User</button></div></div>
  <div class="bar" style="padding-top:8px"><div class="l"><select class="sel" style="width:200px" data-a="uf" data-f="plant"><option value="">All plants</option>${plantsInScope.map(p=>`<option value="${p.id}" ${f.plant===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="in" style="width:260px" placeholder="Search name or email" data-uq value="${esc(f.q)}"></div></div>
  <div class="pad" style="padding-top:0"><div class="tw"><table class="t"><thead><tr><th>User Name</th><th>Email</th><th>Plant</th><th>Division</th><th>Sub-division</th><th>Role(s)</th><th>Status</th><th style="width:60px"></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No users found</td></tr>'}</tbody></table></div></div>`;
}

function userPicker(d){
  const u=me();
  const pool=D.users.filter(x=>x.status!=='Inactive'&&!isAdmin(x));
  const f=d.uf||{plant:'',div:'',q:''};
  let list=pool;
  if(f.plant)list=list.filter(x=>x.plant===f.plant);
  if(f.div)list=list.filter(x=>x.div===f.div);
  if(f.q)list=list.filter(x=>x.name.toLowerCase().includes(f.q.toLowerCase()));
  const divOpts=D.divs.filter(x=>!f.plant||x.plant===f.plant);
  const rows=list.map(x=>{const locked=x.id===d.creator;const on=d.members.includes(x.id);return `<div class="urow ${locked?'lock':''}" ${locked?'':`data-a="pickUser" data-id="${x.id}"`}>${cb(on,'',locked?'dis':'')}<div><div class="nm">${esc(x.name)}${locked?' <span class="chip gray">Creator</span>':''}</div><div class="pl">${esc(placement(x))}</div></div><div class="rs">${x.roles.map(roleChip).join('')}</div></div>`;}).join('');
  return `<div class="sec"><h4>Project Access</h4><div class="sub">${d.members.length} user${d.members.length===1?'':'s'} selected · Org, plant and division admins always have access</div>
    <div class="filters"><select class="sel" data-a="pf" data-f="plant"><option value="">All plants</option>${D.plants.map(p=>`<option value="${p.id}" ${f.plant===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select class="sel" data-a="pf" data-f="div"><option value="">All divisions</option>${divOpts.map(p=>`<option value="${p.id}" ${f.div===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="in" placeholder="Search users" data-pq value="${esc(f.q)}"></div>
    <div class="ulist" data-scroll="ul">${rows||'<div class="empty" style="font-size:14px">No users match</div>'}</div></div>`;
}

function placementFields(d,lockToMine){
  const u=me();const sc=scope(u);

  const divs=D.divs.filter(x=>x.plant===d.plant&&(!sc.div||x.id===sc.div));
  const subs=D.subs.filter(x=>x.div===d.div);

    <div><label class="lb">Instance Name</label><input class="in" data-f="name" value="${esc(d.name)}" placeholder="Enter instance name">${d.err&&!d.name.trim()?'<div class="err">Instance name is required</div>':''}</div>
    <div class="row3">
      <div><label class="lb">Plant <span class="rq">*</span></label><select class="sel" data-a="dsel" data-f="plant" ${sc.plant?'disabled':''}><option value="">Select</option>${plants.map(p=>`<option value="${p.id}" ${d.plant===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${d.err&&!d.plant?'<div class="err">Required</div>':''}</div>
      <div><label class="lb">Division</label><select class="sel" data-a="dsel" data-f="div" ${sc.div||!d.plant?'disabled':''}><option value="">All divisions</option>${divs.map(p=>`<option value="${p.id}" ${d.div===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div><label class="lb">Sub-division</label><select class="sel" data-a="dsel" data-f="sub" ${sc.sub||!d.div?'disabled':''}><option value="">All sub-divisions</option>${subs.map(p=>`<option value="${p.id}" ${d.sub===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    </div>
    <div style="font-size:13px;color:var(--g500)">Visible to people in this ${d.sub?'sub-division':d.div?'division':'plant'} and its admins.</div>
  </div>`;
  return drawerShell('Create Instance','xs',body,`<button class="btn bd" data-a="close">Cancel</button><button class="btn" data-a="saveInst">Create</button>`);
}
function drawerShell(title,size,body,foot){return `<div class="bk" data-a="close"></div><div class="dr ${size}"><div class="dh">${title}<span class="x" data-a="close">✕</span></div><div class="db" data-scroll="db">${body}</div><div class="df">${foot}</div></div>`;}

/* role drawer (CreateRoleDrawer look) */
function roleDrawer(d){
  const steps=['Basic Information','Permissions'];
  const st=steps.map((t,i)=>{const c=i===d.step?'cur':i<d.step?'done':'todo';return `<div class="s"><div class="c"><div class="d ${c}">${c==='done'?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>':''}</div>${i<steps.length-1?`<div class="ln ${i<d.step?'done':''}"></div>`:''}</div><div class="lb2 ${i===d.step?'cur':''}" data-a="rstep" data-s="${i}">${t}</div></div>`;}).join('');
  const ro=d.mode==='view';
  let ct;
  if(d.step===0){
    const dup=d.name.trim()&&D.roles.some(r=>r.name.toLowerCase()===d.name.trim().toLowerCase()&&r.id!==d.id);
    ct=`<div class="basic"><div class="hh">Basic Information</div><div class="pp">Provide a name for the role and a short description for it.</div>
      <div class="fld"><div class="lb">Role Name<span class="rq">*</span></div><input class="in" data-f="name" value="${esc(d.name)}" placeholder="Enter role name" ${ro?'disabled':''}>${dup?`<div class="err" style="font-size:14px">A role named ${esc(d.name.trim())} already exists.</div>`:''}</div>
      <div class="fld"><div class="lb">Role Description<span class="rq">*</span></div><input class="in" data-f="desc" value="${esc(d.desc)}" placeholder="Enter role description" ${ro?'disabled':''}></div></div>`;
  } else if(d.admin){
    const r=R(d.id);const where={org:'the whole organization',plant:'their own plant',div:'their own division'}[r.level];
    ct=`<div class="scope"><h3>${esc(r.name)}</h3><ul>
      <li>Sees <b>every project</b> and has <b>all permissions</b> inside each one</li>
      <li>Sees instances in ${where}</li>
      <li>Adds and edits users in ${where}</li>
      <li>Assigns any role at or below their own admin level</li>
      <li>Creates custom roles</li>
      <li>${r.level==='org'?'Creates plants, divisions and sub-divisions':r.level==='plant'?'Creates divisions and sub-divisions in their plant':'Creates sub-divisions in their division'}</li>
    </ul></div>${permGrid(mkPerms(Object.fromEntries(AREAS.map(a=>[a.id,a.cols])),ALL_SPECIALS.map(s=>s.id)),true)}`;
  } else {
    ct=permGrid(d.perms,ro);
  }
  const dirty=JSON.stringify([d.name.trim(),d.desc.trim(),d.perms])!==d.base;
  const okBasic=d.name.trim()&&d.desc.trim()&&!D.roles.some(r=>r.name.toLowerCase()===d.name.trim().toLowerCase()&&r.id!==d.id);
  let foot;
  if(ro) foot=`<div class="l">${d.step===0?`<button class="btn" data-a="rnext">Next</button>`:`<button class="btn bd" data-a="rback">Back</button>`}</div><button class="btn bd" data-a="close">Close</button>`;
  else foot=`<div class="l">${d.step===0?`<button class="btn" data-a="rnext" ${okBasic?'':'disabled'}>Next</button>`:`<button class="btn bd" data-a="rback">Back</button>`}${d.step===1||d.mode==='edit'?`<button class="btn" data-a="saveRole" ${dirty&&okBasic?'':'disabled'}>Save</button><span style="font-size:13px;color:var(--g500)">${dirty?'Unsaved changes':'No changes yet'}</span>`:''}</div><button class="btn bd" data-a="close">Cancel</button>`;
  const title=d.mode==='add'?'Add New Role':d.mode==='edit'?'Edit Role':'View Role';
  return `<div class="rov"><div class="rdr"><div class="h">${title}<span style="cursor:pointer" data-a="close">X</span></div><div class="b"><div class="stp"><div class="vs">${st}</div></div><div class="ct" data-scroll="rc">${ct}</div></div><div class="f">${foot}</div></div></div>`;
}
function permGrid(p,ro){
  const rows=AREAS.map(a=>{
    const cells=COLS.map(([c])=>{
      if(c==='view')return `<div class="c">${cb(true,'title="View is included for everyone added to a project"','dis')}</div>`;
      if(!a.cols.includes(c))return `<div class="c"></div>`;
      return `<div class="c">${cb(p.areas[a.id][c],ro?'':`data-a="pc" data-ar="${a.id}" data-c="${c}"`,ro?'dis':'')}</div>`;
    }).join('');
    let h=`<div class="prow"><div class="r"><b>${a.row}</b><small>${a.note}</small></div>${cells}</div>`;
    a.specials.forEach(s=>{h+=`<div class="prow sp"><div class="r"><span class="swl"><span class="sw ${p.specials[s.id]?'on':''} ${ro?'dis':''}" ${ro?'':`data-a="ps" data-id="${s.id}"`}></span>${s.name}</span></div>${COLS.map(()=>'<div class="c"></div>').join('')}</div>`;});
    return h;
  }).join('');
  return `<div class="perm"><h2>Permissions</h2><p class="ds">${ro?'Permissions included in this role':'Set the permissions for this role by choosing from the options below'}</p><div class="gh2"><div class="r">Resource</div>${COLS.map(([,l])=>`<div class="c">${l}</div>`).join('')}</div>${rows}</div>`;
}

/* ======================= MODAL ======================= */
function modal(m){
  return `<div class="mbk"><div class="mdl"><div class="mh">${m.title}<span style="cursor:pointer" data-a="mclose">✕</span></div><div class="mb">${m.body}</div><div class="mf">${m.ok?`<button class="btn bd" data-a="mclose">Cancel</button><button class="btn" data-a="mok">${m.ok}</button>`:`<button class="btn" data-a="mclose">OK</button>`}</div></div></div>`;
}

/* ======================= RENDER ======================= */
function render(){
  const keep={};document.querySelectorAll('[data-scroll]').forEach(e=>keep[e.dataset.scroll]=e.scrollTop);
  if(!allowedPage(S.page)){S.page='projects';}
  let h='';
  if(S.page==='project'){h+=rail()+`<main class="main proj">${pageProject()}</main>`;}
  else{
    h+=sidebar()+`<main class="main">`;
    h+={projects:pageProjects,org:pageOrg,users:pageUsers,roles:pageRoles,edge:pageEdge,manual:pageManual}[S.page]();
    h+=`</main>`;
  }
  const d=S.drawer;
  if(d){h+=d.type==='project'?drawerProject(d):d.type==='user'?drawerUser(d):d.type==='inst'?drawerInst(d):d.type==='role'?roleDrawer(d):'';}
  if(S.modal)h+=modal(S.modal);
  if(S.toast)h+=`<div class="toast"><i class="${S.toast.ok?'ok':'no'}">${S.toast.ok?'✓':'!'}</i><span>${S.toast.msg}</span></div>`;
  $('app').innerHTML=h;
  document.querySelectorAll('[data-scroll]').forEach(e=>{if(keep[e.dataset.scroll])e.scrollTop=keep[e.dataset.scroll];});
}

/* ======================= ACTIONS ======================= */
const A={
  go:e=>{S.page=e.dataset.pg;S.menu=null;S.whoOpen=false;},
  who:()=>{S.whoOpen=!S.whoOpen;},
  as:e=>{S.me=e.dataset.id;S.whoOpen=false;S.menu=null;S.drawer=null;const u=me();if(S.page==='project'&&!projVisible(P(S.pid)))S.page='projects';if(!allowedPage(S.page))S.page='projects';toast('Now viewing as '+esc(u.name));},
  menu:e=>{S.menu=S.menu===e.dataset.id?null:e.dataset.id;},
  open:e=>{S.pid=e.dataset.id;S.page='project';S.ptab='recipe';},
  ptab:e=>{S.ptab=e.dataset.t;},
  stub:e=>{toast(e.dataset.m);},
  lic:()=>{toast('Download Demo License opened');},
  tog:e=>{S.closed[e.dataset.id]=!S.closed[e.dataset.id];},
  close:()=>{S.drawer=null;},
  mclose:()=>{S.modal=null;},
  mok:()=>{const f=S.modal.fn;S.modal=null;f&&f();},

  newProject:()=>{S.drawer={type:'project',mode:'add',name:'',desc:'',creator:S.me,members:isAdmin(me())?[]:[S.me],uf:{plant:'',div:'',q:''}};},
  editProject:e=>{const p=P(e.dataset.id);S.drawer={type:'project',mode:'edit',pid:p.id,name:p.name,desc:p.desc,creator:p.createdBy,members:[...p.members],uf:{plant:'',div:'',q:''}};},
  access:e=>{const p=P(e.dataset.id);S.menu=null;S.drawer={type:'project',mode:'access',pid:p.id,name:p.name,desc:p.desc,creator:p.createdBy,members:[...p.members],uf:{plant:'',div:'',q:''}};},
  pickUser:e=>{const d=S.drawer,id=e.dataset.id;d.members=d.members.includes(id)?d.members.filter(x=>x!==id):[...d.members,id];},
  saveProject:()=>{const d=S.drawer;if(!d.name.trim()){d.err=true;return;}
    if(d.mode==='add'){D.projects.unshift({id:nid('pr'),name:d.name.trim(),desc:d.desc.trim(),createdBy:S.me,createdAt:'Oct 16, 2026',members:d.members,variants:[{name:'Variant 1',caps:[['Camera 1','Capture 1',0]]}],datasets:[],models:[],instances:[]});toast('Project created');}
    else{const p=P(d.pid);p.name=d.name.trim();p.desc=d.desc.trim();p.members=d.members;toast(d.mode==='access'?'Project access updated':'Project updated');}
    S.drawer=null;},
  delProject:e=>{const p=P(e.dataset.id);S.menu=null;S.modal={title:'Confirmation Message',body:`Are you sure you want to delete the project <b>${esc(p.name)}</b>?`,ok:'Delete',fn:()=>{D.projects=D.projects.filter(x=>x.id!==p.id);toast('Project deleted');}};},

  newInst:()=>{const sc=scope(me());S.drawer={type:'inst',name:'',plant:sc.plant||'',div:sc.div||'',sub:sc.sub||''};},
  saveInst:()=>{const d=S.drawer;if(!d.name.trim()||!d.plant){d.err=true;return;}P(S.pid).instances.push({id:nid('i'),name:d.name.trim(),plant:d.plant,div:d.div||null,sub:d.sub||null,date:'Oct 16, 2026',valid:'Apr 16, 2027',iid:Math.random().toString(16).slice(2,8)});S.drawer=null;toast('Instance created');},
  delInst:e=>{const p=P(S.pid);const i=p.instances.find(x=>x.id===e.dataset.id);S.modal={title:'Confirmation Message',body:`Are you sure you want to delete the instance <b>${esc(i.name)}</b>?`,ok:'Delete',fn:()=>{p.instances=p.instances.filter(x=>x.id!==i.id);toast('Instance deleted');}};},

  newUser:()=>{const sc=scope(me());S.drawer={type:'user',id:null,name:'',email:'',phone:'',plant:sc.plant||'',div:sc.div||'',sub:'',roles:[]};},
  editUser:e=>{const t=U(e.dataset.id);S.menu=null;S.drawer={type:'user',id:t.id,name:t.name,email:t.email,phone:t.phone,plant:t.plant||'',div:t.div||'',sub:t.sub||'',roles:[...t.roles]};},
  pickRole:e=>{const d=S.drawer,id=e.dataset.id;d.roles=d.roles.includes(id)?d.roles.filter(x=>x!==id):[...d.roles,id];},
  saveUser:()=>{const d=S.drawer;
    const lvl=d.roles.map(r=>(R(r)||{}).level).filter(Boolean).sort((a,b)=>({org:3,plant:2,div:1}[b]-{org:3,plant:2,div:1}[a]))[0]||null;
    const needP=lvl!=='org',needD=!lvl||lvl==='div',needS=!lvl;
    if(!d.name.trim()||!d.email.trim()||!d.roles.length||(needP&&!d.plant)||(needD&&!d.div)||(needS&&!d.sub)){d.err=true;return;}
    const rec={name:d.name.trim(),email:d.email.trim(),phone:d.phone,plant:needP?d.plant:null,div:needD||lvl==='div'?d.div||null:null,sub:needS?d.sub:null,roles:d.roles};
    if(lvl==='plant'){rec.div=null;rec.sub=null;} if(lvl==='div'){rec.div=d.div;rec.sub=null;}
    if(d.id){Object.assign(U(d.id),rec);toast('User successfully updated!');}else{D.users.push({id:nid('u'),...rec,status:'Invited'});toast('Invitation sent to ['+esc(rec.email)+']');}
    S.drawer=null;},
  deactUser:e=>{const t=U(e.dataset.id);S.menu=null;
    if(adminLevel(t)==='org'&&D.users.filter(x=>adminLevel(x)==='org'&&x.status==='Active').length<=1){S.modal={title:'Cannot deactivate',body:`${esc(t.name)} is the only active Org Admin. Make someone else an Org Admin first.`};return;}
    S.modal={title:'Confirmation Message',body:`Are you sure you want to deactivate [${esc(t.name)}]?`,ok:'Deactivate',fn:()=>{t.status='Inactive';toast('User deactivated');}};},
  actUser:e=>{U(e.dataset.id).status='Active';S.menu=null;toast('User activated');},

  newRole:()=>{const p=viewOnlyPerms();S.drawer={type:'role',mode:'add',step:0,id:null,name:'',desc:'',perms:p,base:JSON.stringify(['','',p])};},
  viewRole:e=>{const r=R(e.dataset.id);S.menu=null;S.drawer={type:'role',mode:'view',step:1,id:r.id,admin:r.kind==='admin',name:r.name,desc:r.desc,perms:rolePerms(r),base:''};},
  editRole:e=>{const r=R(e.dataset.id);S.menu=null;const p=JSON.parse(JSON.stringify(r.perms));S.drawer={type:'role',mode:'edit',step:0,id:r.id,name:r.name,desc:r.desc,perms:p,base:JSON.stringify([r.name,r.desc,p])};},
  rstep:e=>{const d=S.drawer;const s=+e.dataset.s;if(s===1&&d.mode!=='view'&&!(d.name.trim()&&d.desc.trim()))return;d.step=s;},
  rnext:()=>{S.drawer.step=1;}, rback:()=>{S.drawer.step=0;},
  pc:e=>{const d=S.drawer;const a=e.dataset.ar,c=e.dataset.c;d.perms.areas[a][c]=!d.perms.areas[a][c];},
  ps:e=>{const d=S.drawer;d.perms.specials[e.dataset.id]=!d.perms.specials[e.dataset.id];},
  saveRole:()=>{const d=S.drawer;const rec={name:d.name.trim(),desc:d.desc.trim(),perms:d.perms};
    if(d.mode==='edit'){Object.assign(R(d.id),rec);toast('Role saved');}else{D.roles.push({id:nid('c_'),kind:'custom',...rec});toast('Role created');}S.drawer=null;},
  delRole:e=>{const r=R(e.dataset.id);S.menu=null;const us=usersWithRole(r.id);
    if(us.length){S.modal={title:'Role is in use',body:`<b>${esc(r.name)}</b> is assigned to ${us.length} user${us.length>1?'s':''} (${us.map(u=>esc(u.name)+(u.status==='Inactive'?' – inactive':'')).join(', ')}). Remove it from them before deleting.`};return;}
    S.modal={title:'Confirmation Message',body:`Are you sure you want to delete the role <b>${esc(r.name)}</b>? This cannot be undone.`,ok:'Delete',fn:()=>{D.roles=D.roles.filter(x=>x.id!==r.id);toast('Role deleted');}};},

  addUnit:e=>{const k=e.dataset.k,parent=e.dataset.parent;const lbl={plant:'Plant',div:'Division',sub:'Sub-division'}[k];
    const pn=k==='div'?' in '+esc(plantN(parent)):k==='sub'?' in '+esc(divN(parent)):'';
    S.modal={title:`Add ${lbl}${pn}`,body:`<label class="lb">${lbl} Name</label><input class="in" id="unitName" placeholder="Enter ${lbl.toLowerCase()} name">`,ok:'Add',fn:()=>{}};S.modal.fn=null;S.modal.unit={k,parent};},
  renUnit:e=>{const k=e.dataset.k,id=e.dataset.id;const arr={plant:D.plants,div:D.divs,sub:D.subs}[k];const o=arr.find(x=>x.id===id);const lbl={plant:'Plant',div:'Division',sub:'Sub-division'}[k];
    S.modal={title:`Rename ${lbl}`,body:`<label class="lb">${lbl} Name</label><input class="in" id="unitName" value="${esc(o.name)}">`,ok:'Save',unit:{k,id,rename:true}};},
  delUnit:e=>{const k=e.dataset.k,id=e.dataset.id;const arr={plant:D.plants,div:D.divs,sub:D.subs}[k];const o=arr.find(x=>x.id===id);
    const kids=k==='plant'?D.divs.filter(x=>x.plant===id).length:k==='div'?D.subs.filter(x=>x.div===id).length:0;const us=countUsers(k,id),ins=countInst(k,id);
    if(kids||us||ins){S.modal={title:'Cannot delete',body:`<b>${esc(o.name)}</b> still has ${[kids?kids+(k==='plant'?' division(s)':' sub-division(s)'):'',us?us+' user(s)':'',ins?ins+' instance(s)':''].filter(Boolean).join(', ')}. Move or remove them first.`};return;}
    S.modal={title:'Confirmation Message',body:`Are you sure you want to delete <b>${esc(o.name)}</b>?`,ok:'Delete',fn:()=>{const i=arr.indexOf(o);arr.splice(i,1);toast('Deleted');}};},
};
function unitSave(){const m=S.modal;const v=($('unitName')||{}).value||'';if(!v.trim())return toast('Enter a name',false);
  const u=m.unit;
  if(u.rename){const arr={plant:D.plants,div:D.divs,sub:D.subs}[u.k];arr.find(x=>x.id===u.id).name=v.trim();toast('Renamed');}
  else if(u.k==='plant'){D.plants.push({id:nid('p'),name:v.trim()});toast('Plant added');}
  else if(u.k==='div'){D.divs.push({id:nid('d'),name:v.trim(),plant:u.parent});S.closed['pl_'+u.parent]=false;toast('Division added');}
  else {D.subs.push({id:nid('s'),name:v.trim(),div:u.parent});S.closed['dv_'+u.parent]=false;toast('Sub-division added');}
  S.modal=null;render();}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]');
  if(!t){if(S.menu||S.whoOpen){S.menu=null;S.whoOpen=false;render();}return;}
  const a=t.dataset.a;
  if(t.tagName==='SELECT')return;
  if(a==='mok'&&S.modal&&S.modal.unit){unitSave();return;}
  if(!A[a])return;
  if(a!=='menu'&&a!=='who')S.menu=null;
  A[a](t);render();
});
document.addEventListener('change',ev=>{
  const t=ev.target;const d=S.drawer;
  if(t.dataset.a==='dsel'&&d){const f=t.dataset.f;d[f]=t.value;if(f==='plant'){d.div='';d.sub='';}if(f==='div'){d.sub='';}render();}
  else if(t.dataset.a==='pf'&&d){d.uf[t.dataset.f]=t.value;if(t.dataset.f==='plant')d.uf.div='';render();}
  else if(t.dataset.a==='uf'){S.ufilter.plant=t.value;render();}
});
document.addEventListener('input',ev=>{
  const t=ev.target;const d=S.drawer;
  if(d&&t.dataset.f&&t.tagName==='INPUT'){d[t.dataset.f]=t.value;
    if(d.type==='role'){const f=document.querySelector('.rdr .f');const tmp=document.createElement('div');tmp.innerHTML=roleDrawer(d);f.innerHTML=tmp.querySelector('.f').innerHTML;
      const fld=t.parentElement,old=fld.querySelector('.err');if(old)old.remove();const dup=d.name.trim()&&D.roles.some(r=>r.name.toLowerCase()===d.name.trim().toLowerCase()&&r.id!==d.id);if(t.dataset.f==='name'&&dup){const x=document.createElement('div');x.className='err';x.style.fontSize='14px';x.textContent='A role named '+d.name.trim()+' already exists.';fld.appendChild(x);}}
    return;}
  if(d&&t.hasAttribute('data-pq')){d.uf.q=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-pq]');n.focus();n.setSelectionRange(pos,pos);return;}
  if(t.hasAttribute('data-uq')){S.ufilter.q=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-uq]');n.focus();n.setSelectionRange(pos,pos);}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='unitName'){unitSave();}if(ev.key==='Escape'){S.drawer=null;S.modal=null;S.menu=null;S.whoOpen=false;render();}});
render();
</script>
