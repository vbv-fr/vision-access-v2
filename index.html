<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frinks Vision · Access v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --p:#ff4301; --p90:rgba(255,67,1,.9); --light:#fdece5;
  --g50:#f9fafb; --g100:#f3f4f6; --g200:#e5e7eb; --g300:#d1d5db; --g400:#9ca3af; --g500:#6b7280; --g600:#4b5563; --g700:#374151; --g800:#1f2937; --g900:#111827;
  --side:#1e1c1c; --dl:#E3E5E5; --red:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Outfit',sans-serif;color:#000;background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
#tt{position:fixed;z-index:400;background:#1e1c1c;color:#fff;font-size:12px;line-height:1.4;padding:6px 10px;border-radius:6px;max-width:280px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25)}

/* ---------- main sidebar (350px, #1e1c1c) ---------- */
.side{position:fixed;left:0;top:0;bottom:0;width:350px;background:var(--side);border-right:1px solid var(--g300);display:flex;flex-direction:column;padding:24px 0 16px 20px;color:#fff;z-index:20}
.logo{padding:8px 8px 0;font-size:30px;font-weight:600;letter-spacing:-.01em}
.logo b{color:var(--p)}
.menu{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.mi{display:flex;align-items:center;margin-right:24px;padding:8px;border-radius:6px;cursor:pointer;font-size:18px;color:#fff;transition:background .3s}
.mi:hover{background:rgba(255,255,255,.1)}
.mi.active{background:rgba(255,255,255,.2)}
.mi.grp{cursor:default}.mi.grp:hover{background:none}
.mi.gd{opacity:.38;cursor:not-allowed}.mi.gd:hover{background:none}
.mi .ic{width:32px;display:flex;justify-content:center;flex:none}
.mi .t{margin-left:16px}
.subm{list-style:none;margin:2px 0 4px;padding:0;display:flex;flex-direction:column;gap:4px}
.subm .mi{padding-left:56px;font-size:17px}
.who{margin-top:auto;margin-right:20px;position:relative}
.whob{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.12)}
.whob:hover{background:rgba(255,255,255,.08)}
.av{width:34px;height:34px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.whob .nm{font-size:15px;font-weight:500}
.whob .rl{font-size:12px;color:#bdbdbd;line-height:1.3}
.whomenu{position:absolute;bottom:64px;left:0;right:0;background:#fff;color:#111;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);max-height:72vh;overflow:auto;padding:6px}
.whomenu .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);padding:8px 10px 4px}
.whomenu .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.whomenu .it:hover{background:var(--g100)}
.whomenu .it.on{background:var(--light)}
.whomenu .it .av{width:28px;height:28px;font-size:10px}
.whomenu .it small{display:block;color:var(--g500);font-size:12px;line-height:1.3}

/* ---------- project rail (80px) ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:80px;background:var(--side);border-right:1px solid var(--g300);display:flex;flex-direction:column;align-items:center;padding:24px 8px;z-index:20}
.rail .lg{color:#fff;font-weight:700;font-size:20px;margin:12px 0 40px;cursor:pointer}
.rail .lg b{color:var(--p)}
.rail ul{list-style:none;margin:32px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%}
.rail li{position:relative}
.rail .ri{display:flex;justify-content:center;padding:8px 0;border-radius:6px;color:#fff;cursor:pointer}
.rail .ri:hover,.rail .ri.active{background:rgba(255,255,255,.2)}
.rail .tip{position:absolute;left:100%;top:50%;transform:translate(-4px,-50%);margin-left:12px;padding:6px 10px;font-size:12px;font-weight:600;color:#fff;background:var(--p);border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:.25s}
.rail li:hover .tip{opacity:1;transform:translate(0,-50%)}
.rail .bottom{margin-top:auto;width:100%}
.rail .rwho{margin-top:12px;display:flex;justify-content:center;cursor:pointer}
.whomenu.fixed{position:fixed;left:90px;right:auto;bottom:20px;width:360px;z-index:50}

/* ---------- page ---------- */
.main{margin-left:350px;min-height:100%}
.main.proj{margin-left:80px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;height:60px;margin-top:4px;padding:16px 20px;background:#fff}
.heading .t{font-size:30px;font-weight:500}
.heading .acts{display:flex;align-items:center;gap:12px}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--g500)}
.crumb span{padding:4px 8px;border-radius:6px;font-weight:500;color:var(--g600)}
.crumb span.cur{font-weight:600;color:var(--g900)}
.crumb span.lnk{cursor:pointer}
.crumb span.lnk:hover{color:var(--p);background:var(--g100)}
.pad{padding:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px}
.bar .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{font-weight:600;font-size:14px;padding:8px 24px;border-radius:6px;cursor:pointer;border:1px solid transparent;background:var(--p);color:#fff;line-height:20px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--p90)}
.btn.md{padding:6px 16px}
.btn.ssm{font-size:12px;padding:4px 8px}
.btn.bd{background:transparent;border-color:var(--p);color:var(--p)}
.btn.bd:hover{opacity:.7}
.btn.gd,.btn.gd:hover{background:var(--g200);color:var(--g500);border-color:transparent;cursor:not-allowed;opacity:1}
.btn:disabled{background:var(--g200);color:var(--g500);border-color:transparent;cursor:not-allowed}

/* table (orange header like Table.tsx) */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:720px}
table.t thead tr{background:var(--p)}
table.t th{color:#fff;font-weight:500;font-size:16px;padding:16px 8px;text-align:center;position:relative;white-space:nowrap}
table.t th:not(:last-child)::after{content:"";position:absolute;right:0;top:10px;bottom:10px;width:2px;border-radius:16px;background:#fff}
table.t td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--g200);font-size:15px;color:#000}
table.t tr.dim td{color:var(--g400)}
table.t td.l,table.t th.l{text-align:left;padding-left:20px}
.empty{padding:28px;text-align:center;font-size:18px;font-weight:600}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,67,1,.1);color:var(--p);border:1px solid rgba(255,67,1,.2);font-size:12.5px;font-weight:500;margin:2px;white-space:nowrap}
.chip.adm{background:var(--p);color:#fff;border-color:var(--p)}
.chip.org{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.chip.cus{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe}
.chip.gray{background:var(--g100);color:var(--g600);border-color:var(--g200)}
.st{font-size:13px;font-weight:600}
.st.Active{color:#16a34a}.st.Invited{color:#d97706}.st.Inactive{color:var(--g400)}
.ia{display:inline-flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.ib{width:30px;height:30px;border-radius:6px;display:inline-grid;place-items:center;cursor:pointer;color:var(--g700)}
.ib:hover{background:var(--g100)}
.ib.red{color:var(--red)}
.ib.gd{color:var(--g300);cursor:not-allowed}.ib.gd:hover{background:none}
.link{color:var(--p);text-decoration:underline;font-weight:500}
sup.draft{color:#FF1212;font-size:12px;margin-left:2px}

/* dots menu */
.dd{position:relative;display:inline-block}
.ddm{position:absolute;right:30px;top:0;z-index:40;background:#fff;border:1px solid var(--g200);border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.12);list-style:none;margin:0;padding:4px 0;min-width:170px;text-align:left}
.ddm li{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.ddm li:hover{background:var(--g100)}
.ddm li.red{color:var(--red)}
.ddm li.gd{color:var(--g400);cursor:not-allowed}.ddm li.gd:hover{background:none}

/* project cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px;margin-top:8px}
.card{position:relative;min-height:160px;border:1px solid var(--g200);border-radius:8px;background:#fff;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:space-between;transition:all .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.card .top{display:flex;gap:16px;padding-right:24px}
.card .ico{width:48px;height:48px;border-radius:16px;background:var(--light);color:var(--p);display:grid;place-items:center;flex:none}
.card h3{margin:0;font-size:16px;font-weight:600;color:var(--g900);padding-top:4px}
.card:hover h3{color:var(--p)}
.card .desc{margin-top:6px;font-size:14px;color:var(--g500);line-height:1.35}
.card .mem{font-size:12px;color:var(--g500);margin-top:8px}
.card .bot{margin-top:24px;padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .by{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--g800);min-width:0}
.card .by .av{width:32px;height:32px;font-size:11px}
.card .by .av.na{background:var(--g400)}
.card .dt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--g500);white-space:nowrap}
.card .dt i{width:6px;height:6px;border-radius:50%;background:var(--p)}
.card .menu3{position:absolute;right:14px;top:14px;opacity:0;transition:.2s;z-index:5}
.card:hover .menu3,.card .menu3.open{opacity:1}
.card .ov{position:absolute;inset:auto 0 0 0;height:96px;display:flex;align-items:center;justify-content:center;gap:12px;padding:24px 24px 8px;background:linear-gradient(to top,#fff,rgba(255,255,255,.95),transparent);opacity:0;transform:translateY(20px);transition:.3s;border-radius:0 0 8px 8px}
.card:hover .ov{opacity:1;transform:none}
.card .ov .btn{flex:1;justify-content:center}
.create{min-height:160px;border:2px dashed var(--g300);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:.3s}
.create:hover{border-color:rgba(255,67,1,.5);background:rgba(249,250,251,.5);box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
.create .pl{width:52px;height:52px;border-radius:14px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:300;margin-bottom:16px}
.create h3{margin:0;font-size:16px;font-weight:700;color:var(--g900)}
.create p{margin:4px 0 0;font-size:14px;font-weight:500;color:var(--g500)}
.create.gd{opacity:.5;cursor:not-allowed}.create.gd:hover{border-color:var(--g300);background:#fff;box-shadow:none}
.create.gd .pl{background:var(--g400)}
.noacc{display:flex;gap:12px;align-items:center;width:fit-content;border-radius:8px;padding:12px 20px 12px 12px;font-size:16px;font-weight:600;box-shadow:3px 3px 5px #00000020;margin:20px}

/* drawer (shared/ui/Drawer) */
.bk{position:fixed;inset:0;background:rgba(180,182,184,.5);z-index:60}
.dr{position:fixed;top:0;right:0;height:100%;width:100%;background:#fff;z-index:61;display:flex;flex-direction:column}
.dr.xs{max-width:520px}.dr.md{max-width:768px}
.dr .dh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--g200);padding:12px 16px 8px;height:50px;font-size:18px;font-weight:600}
.dr .dh .x{cursor:pointer;padding:2px 6px}
.dr .db{flex:1;overflow-y:auto;padding:8px 14px 24px}
.dr .df{display:flex;justify-content:flex-end;gap:16px;align-items:center;border-top:1px solid var(--g200);padding:16px;min-height:80px}
.form{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.lb{display:block;font-size:14px;margin-bottom:4px;color:#000}
.lb .rq{color:var(--red)}
.in,.sel{width:100%;border:1px solid var(--g300);border-radius:6px;padding:8px 12px;font-size:14px;outline:none;background:#fff;color:#000}
.in:focus,.sel:focus{border-color:var(--p);outline:2px solid var(--p);outline-offset:-1px}
.sel:disabled,.in:disabled{background:var(--g100);color:var(--g500);pointer-events:none}
.err{font-size:12px;color:var(--red);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--g200);border-radius:6px;min-height:42px;align-items:center}
.chips .chip{font-size:14px;display:inline-flex;gap:4px;align-items:center}
.chips .chip b{cursor:pointer;font-weight:500}
.chips .chip b:hover{color:var(--red)}
.chips input{border:none;outline:none;flex:1;min-width:160px;font-size:14px;padding:4px}
.sec{border-top:4px solid var(--dl);margin:8px -14px 0;padding:16px 14px 0}
.sec h4{margin:0;font-size:16px;font-weight:600}
.sec .sub{font-size:13px;color:var(--g500);margin-top:2px}
.ulist{border:1px solid var(--g200);border-radius:8px;max-height:360px;overflow-y:auto;margin-top:10px}
.urow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--g100);cursor:pointer}
.urow:last-child{border-bottom:none}
.urow:hover{background:var(--g50)}
.urow.lock{cursor:not-allowed;background:var(--g50)}
.urow .nm{font-weight:500;font-size:14px}
.urow .pl{font-size:12px;color:var(--g500)}
.urow .rs{margin-left:auto;text-align:right;max-width:55%}
.filters{display:flex;gap:8px;margin-top:10px}
.filters .sel,.filters .in{flex:1;width:auto}
.note{font-size:13px;color:var(--g600);background:var(--g50);border:1px dashed var(--g300);padding:8px 10px;border-radius:6px;margin-top:4px}

/* checkbox (ThreeStateCheckbox look) */
.cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--g400);background:#fff;display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:.2s}
.cb svg{width:16px;height:16px;opacity:0}
.cb.on{background:var(--p);border-color:var(--p)}
.cb.on svg{opacity:1}
.cb.dis{cursor:not-allowed;opacity:.55}
.cb.dis.on{background:var(--g400);border-color:var(--g400)}

/* option rows (roles, toggles) */
.rgroup{margin-top:10px}
.rgroup .gh{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);font-weight:600;margin:6px 0}
.ropt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--g200);border-radius:8px;margin-bottom:6px;cursor:pointer}
.ropt:hover{background:var(--g50)}
.ropt.on{border-color:var(--p);background:#fff7f3}
.ropt.gd{cursor:not-allowed;opacity:.5}.ropt.gd:hover{background:none}
.ropt .rn{font-size:14px;font-weight:500}
.ropt .rd{font-size:12px;color:var(--g500);line-height:1.3}
.sw{width:40px;height:22px;border-radius:22px;background:var(--g300);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--p)}
.sw.on::after{transform:translateX(18px)}

/* role drawer (CreateRoleDrawer) */
.rov{position:fixed;inset:0;background:#00000080;z-index:60;display:flex;justify-content:flex-end}
.rdr{height:100vh;width:min(1280px,calc(100vw - 60px));background:#fff;display:flex;flex-direction:column}
.rdr .h{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--dl);padding:0 20px;font-size:18px;font-weight:600}
.rdr .b{flex:1;display:flex;min-height:0}
.rdr .stp{width:260px;flex:none;border-right:2px solid var(--dl);display:flex;align-items:center;justify-content:center}
.vs .s{display:flex;align-items:flex-start}
.vs .c{display:flex;flex-direction:column;align-items:center}
.vs .d{margin:10px 0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.vs .d.cur,.vs .d.done{background:var(--p)}
.vs .d.todo{border:2px solid var(--g400)}
.vs .ln{height:100px;width:2px;background:var(--g300)}
.vs .ln.done{background:var(--p)}
.vs .lb2{margin:10px 0 0 16px;width:150px;font-size:18px;color:var(--g500);cursor:pointer}
.vs .lb2.cur{font-weight:700;color:#000}
.rdr .ct{flex:1;overflow-y:auto;min-width:0}
.rdr .f{min-height:64px;display:flex;justify-content:space-between;align-items:center;border-top:4px solid var(--dl);padding:0 16px 0 276px}
.rdr .f .l{display:flex;gap:16px;align-items:center}
.basic{display:flex;flex-direction:column;gap:16px;padding:40px 80px 40px 40px}
.basic .hh{font-size:30px;font-weight:700}
.basic .pp{font-size:20px}
.basic .fld{padding:0 12px}
.basic .fld .lb{font-size:18px;font-weight:500;margin-bottom:8px}
.basic .in{font-size:16px;padding:12px 14px;border-radius:8px}
.perm{margin:16px;border-radius:8px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);padding:16px}
.perm h2{margin:0 0 6px;font-size:20px;font-weight:700}
.perm .ds{margin:0 0 20px;font-size:16px}
.gh2{position:sticky;top:0;z-index:2;display:flex;background:#fff;border-bottom:2px solid var(--g200);padding:0 16px 6px 18px;margin-bottom:6px}
.gh2 .r{flex:1;font-size:18px;font-weight:700}
.gh2 .c{width:110px;text-align:center;font-size:18px;font-weight:700}
.prow{display:flex;align-items:center;padding:10px 16px;border-radius:8px}
.prow:hover{background:var(--g100)}
.prow .r{flex:1;min-width:0}
.prow .r b{font-weight:600}
.prow .r small{display:block;color:var(--g500);font-size:13px}
.prow .c{width:110px;display:flex;justify-content:center}
.scope{margin:16px;border:1px solid var(--g200);border-radius:8px;padding:16px 20px}
.scope h3{margin:0 0 8px;font-size:18px}
.scope ul{margin:0;padding-left:20px;line-height:1.9}

/* modal */
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:grid;place-items:center}
.mdl{background:#fff;border-radius:10px;width:min(520px,92vw);box-shadow:0 20px 40px rgba(0,0,0,.2)}
.mdl .mh{display:flex;justify-content:space-between;padding:16px 20px;font-size:18px;font-weight:600;border-bottom:1px solid var(--g200)}
.mdl .mb{padding:20px;font-size:15px;display:flex;flex-direction:column;gap:12px}
.mdl .mb ul{margin:0;padding-left:20px}
.mdl .mf{display:flex;justify-content:flex-end;gap:12px;padding:12px 20px 18px}

/* toast (react-hot-toast) */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#fff;color:#363636;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);padding:8px 12px;border-radius:8px;font-size:14px;z-index:99;display:flex;gap:10px;align-items:center;max-width:560px}
.toast i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;flex:none}
.toast i.ok{background:#61d345}.toast i.no{background:#ff4b4b}

.stub{margin:20px;border:1px solid var(--g200);border-radius:8px;padding:24px;max-width:720px}
.stub h3{margin:0 0 6px}
.k{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--g100);font-size:12px;color:var(--g600)}
</style>
</head>
<body>
<div id="app"></div>
<div id="tt" hidden></div>
<script>
/* ======================= ICONS ======================= */

const isOA=u=>!!u&&u.roles.includes('org_admin');
const hasX=(k,u=me())=>isOA(u)||!!(u.x&&u.x[k]);
function userMgr(u=me()){if(isOA(u))return 'all';if(u.roles.includes('mu_org'))return 'org';if(u.roles.includes('mu_plant'))return 'plant';return null;}
const canPT=(u=me())=>isOA(u)||u.roles.includes('mpt');
function emptyP(){const a={};AREAS.forEach(ar=>{a[ar.id]={};ar.cols.forEach(c=>a[ar.id][c]=false)});return a;}
function fullP(){const a={};AREAS.forEach(ar=>{a[ar.id]={};ar.cols.forEach(c=>a[ar.id][c]=true)});return a;}
function rolePerms(r){if(r.type==='admin')return fullP();if(r.type==='work'){const p=emptyP();AREAS.find(a=>a.id===r.area).cols.forEach(c=>p[r.area][c]=true);return p;}if(r.type==='custom')return r.perms;return emptyP();}
function perms(u){if(isOA(u))return fullP();const p=emptyP();u.roles.forEach(id=>{const r=R(id);if(!r)return;const rp=rolePerms(r);AREAS.forEach(a=>a.cols.forEach(c=>{if(rp[a.id][c])p[a.id][c]=true}))});return p;}
const can=(area,col,u=me())=>!!perms(u)[area][col];
const isDraft=i=>!i.plant||!i.team;
const instVisible=(i,u=me())=>isOA(u)||(!isDraft(i)&&i.plant===u.plant&&i.team===u.team);
const projVisible=(p,u=me())=>isOA(u)||p.members.includes(u.id)||p.createdBy===u.id;
const canCreateProject=(u=me())=>isOA(u)||can('project','create',u);
const canEditProject=(p,u=me())=>isOA(u)||can('project','edit',u);
const canDeleteProject=(p,u=me())=>isOA(u)||can('project','delete',u);
const canManageAccess=(p,u=me())=>isOA(u)||(can('project','edit',u)&&(p.members.includes(u.id)||p.createdBy===u.id));
function canActOnUser(t,a=me()){const m=userMgr(a);if(!m)return false;if(t.id===a.id)return true;if(m==='all')return true;if(isOA(t))return false;if(m==='org')return true;return t.plant===a.plant;}
function canGiveRole(r,a=me()){if(isOA(a))return true;if(!userMgr(a))return false;if(r.id==='org_admin')return false;if(a.roles.includes(r.id))return true;if(r.id==='mu_plant'&&a.roles.includes('mu_org'))return true;return false;}
const canGiveX=(k,a=me())=>isOA(a)||(!!userMgr(a)&&!!(a.x&&a.x[k]));
const customers=()=>D.users.filter(u=>!u.frinks);
function lastOA(t){const oas=customers().filter(u=>isOA(u)&&u.status==='Active');return isOA(t)&&!t.frinks&&oas.length<=1;}
function rolesLine(u){return u.roles.length?u.roles.map(r=>(R(r)||{}).name).filter(Boolean).join(', '):'Viewer';}
function placement(u){return isOA(u)?'No plant or team':`${plantN(u.plant)} / ${teamN(u.team)}`;}
function roleChip(id){const r=R(id);if(!r)return '';const c={admin:'adm',org:'org',custom:'cus',default:'gray'}[r.type]||'';return `<span class="chip ${c}">${esc(r.name)}</span>`;}
function roleChips(u){return u.roles.length?u.roles.map(roleChip).join(''):'<span class="chip gray">Viewer</span>';}
function creatorLabel(p){if(p.transferred)return 'Transferred';const u=U(p.createdBy);if(!u)return (D.deleted[p.createdBy]||'Unknown')+' (deactivated)';if(u.status==='Inactive')return u.name+' (deactivated)';return u.name;}

  const body=`<div class="form">

/* role drawer (CreateRoleDrawer look) */
function permGrid(p,ro){
  const rows=AREAS.map(a=>{
    const cells=COLS.map(([c])=>{
      if(c==='view')return `<div class="c">${cb(true,'data-tip="Everyone is a Viewer, so View is always on."','dis')}</div>`;
      if(!a.cols.includes(c))return `<div class="c"></div>`;
      return `<div class="c">${cb(p[a.id][c],ro?'':`data-a="pc" data-ar="${a.id}" data-c="${c}"`,ro?'dis':'')}</div>`;
    }).join('');
    return `<div class="prow"><div class="r"><b>${a.row}</b><small>${a.note}</small></div>${cells}</div>`;
  }).join('');
  return `<div class="perm"><h2>Permissions</h2><p class="ds">${ro?'Permissions included in this role':'Set the permissions for this role by choosing from the options below'}</p><div class="gh2"><div class="r">Resource</div>${COLS.map(([,l])=>`<div class="c">${l}</div>`).join('')}</div>${rows}</div>`;
}
function roleDrawer(d){
  const steps=['Basic Information','Permissions'];
  const st=steps.map((t,i)=>{const c=i===d.step?'cur':i<d.step?'done':'todo';return `<div class="s"><div class="c"><div class="d ${c}">${c==='done'?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>':''}</div>${i<steps.length-1?`<div class="ln ${i<d.step?'done':''}"></div>`:''}</div><div class="lb2 ${i===d.step?'cur':''}" data-a="rstep" data-s="${i}">${t}</div></div>`;}).join('');
  const ro=d.mode==='view';const r=d.id?R(d.id):null;
  const dup=d.name.trim()&&D.roles.some(x=>x.name.toLowerCase()===d.name.trim().toLowerCase()&&x.id!==d.id);
  let ct;
  if(d.step===0){
    ct=`<div class="basic"><div class="hh">Basic Information</div><div class="pp">Provide a name for the role and a short description for it.</div>
      <div class="fld"><div class="lb">Role Name<span class="rq">*</span></div><input class="in" data-f="name" value="${esc(d.name)}" placeholder="Enter role name" ${ro?'disabled':''}>${dup&&!ro?`<div class="err" style="font-size:14px">A role named ${esc(d.name.trim())} already exists.</div>`:''}</div>
      <div class="fld"><div class="lb">Role Description<span class="rq">*</span></div><input class="in" data-f="desc" value="${esc(d.desc)}" placeholder="Enter role description" ${ro?'disabled':''}></div></div>`;
  } else if(ro&&r.type==='admin'){
    ct=`<div class="scope"><h3>${esc(r.name)}</h3><ul>${CAPS.org_admin.map(x=>`<li>${x}</li>`).join('')}</ul></div>`+permGrid(fullP(),true);
  } else if(ro&&r.type==='org'){
    ct=`<div class="scope"><h3>${esc(r.name)}</h3><ul>${CAPS[r.id].map(x=>`<li>${x}</li>`).join('')}</ul></div>`+permGrid(emptyP(),true);
  } else if(ro&&r.type==='default'){
    ct=`<div class="scope"><h3>Viewer</h3><ul><li>Everyone has this role; it never needs to be given</li><li>View access to every section of the projects they’re added to</li><li>Every action stays greyed out unless another role allows it</li></ul></div>`+permGrid(emptyP(),true);
  } else ct=permGrid(d.perms,ro);
  const dirty=JSON.stringify([d.name.trim(),d.desc.trim(),d.perms])!==d.base;
  const okBasic=d.name.trim()&&d.desc.trim()&&!dup;
  let foot;
  if(ro) foot=`<div class="l">${d.step===0?`<button class="btn" data-a="rnext">Next</button>`:`<button class="btn bd" data-a="rback">Back</button>`}</div><button class="btn bd" data-a="close">Close</button>`;
  else foot=`<div class="l">${d.step===0?`<button class="btn" data-a="rnext" ${okBasic?'':'disabled'}>Next</button>`:`<button class="btn bd" data-a="rback">Back</button>`}${d.step===1||d.mode==='edit'?`<button class="btn" data-a="saveRole" ${dirty&&okBasic?'':'disabled'}>Save</button><span style="font-size:13px;color:var(--g500)">${dirty?'Unsaved changes':'No changes yet'}</span>`:''}</div><button class="btn bd" data-a="close">Cancel</button>`;
  const title=d.mode==='add'?'Add New Role':d.mode==='edit'?'Edit Role':'View Role';
  return `<div class="rov"><div class="rdr"><div class="h">${title}<span style="cursor:pointer" data-a="close">X</span></div><div class="b"><div class="stp"><div class="vs">${st}</div></div><div class="ct" data-scroll="rc">${ct}</div></div><div class="f">${foot}</div></div></div>`;
}

/* ======================= MODALS ======================= */
function modal(m){
  let body=m.body||'';
  if(m.type==='pt'){body=`<div><label class="lb">${m.one} Name</label><input class="in" id="mName" value="${esc(m.val||'')}" placeholder="Enter ${m.one.toLowerCase()} name">${m.err?`<div class="err">${esc(m.err)}</div>`:''}</div><div style="font-size:13px;color:var(--g500)">${m.one}s can’t be renamed or deleted once added.</div>`;}
  if(m.type==='lic'){
    const projs=D.projects.filter(p=>projVisible(p));const p=P(m.proj);
    const insts=p?p.instances.filter(i=>instVisible(i)&&!isDraft(i)):[];
    body=`<div><label class="lb">Project</label><select class="sel" data-a="msel" data-f="proj"><option value="">Select project</option>${projs.map(x=>`<option value="${x.id}" ${m.proj===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div><label class="lb">Instance</label><select class="sel" data-a="msel" data-f="inst" ${p?'':'disabled'}><option value="">${p&&!insts.length?'No instances for your plant and team':'Select instance'}</option>${insts.map(i=>`<option value="${i.id}" ${m.inst===i.id?'selected':''}>${esc(i.name)} · ${plantN(i.plant)} / ${teamN(i.team)}</option>`).join('')}</select>${m.err?`<div class="err">${esc(m.err)}</div>`:''}</div>`;}
  if(m.type==='org'){body=`<div><label class="lb">Move to</label><select class="sel" data-a="msel" data-f="target"><option>Northwind Plastics</option><option>Globex Components</option></select></div><div>When <b>${esc(m.name)}</b> moves:</div><ul><li>All its members are removed</li><li>The creator shows as “Transferred”</li><li>All instances become drafts until the new Org Admin assigns a plant and team</li></ul>`;}
  return `<div class="mbk"><div class="mdl"><div class="mh">${m.title}<span style="cursor:pointer" data-a="mclose">✕</span></div><div class="mb">${body}</div><div class="mf">${m.ok?`<button class="btn bd" data-a="mclose">Cancel</button><button class="btn" data-a="mok">${m.ok}</button>`:`<button class="btn" data-a="mclose">OK</button>`}</div></div></div>`;
}

/* ======================= RENDER ======================= */
function render(){
  const keep={};document.querySelectorAll('[data-scroll]').forEach(e=>keep[e.dataset.scroll]=e.scrollTop);
  $('tt').hidden=true;
  if(!allowedPage(S.page))S.page='projects';
  if(S.page==='project'&&(!P(S.pid)||!projVisible(P(S.pid))))S.page='projects';
  let h='';
  if(S.page==='project')h+=rail()+`<main class="main proj">${pageProject()}</main>`;
  else{
    const pg={projects:pageProjects,plants:()=>pageList('plants'),teams:()=>pageList('teams'),users:pageUsers,roles:pageRoles,edge:pageEdge,manual:pageManual}[S.page];
    h+=sidebar()+`<main class="main">${pg()}</main>`;
  }
  const d=S.drawer;
  if(d)h+={project:drawerProject,user:drawerUser,inst:drawerInst,move:drawerMove,role:roleDrawer}[d.type](d);
  if(S.modal)h+=modal(S.modal);
  if(S.toast)h+=`<div class="toast"><i class="${S.toast.ok?'ok':'no'}">${S.toast.ok?'✓':'!'}</i><span>${S.toast.msg}</span></div>`;
  $('app').innerHTML=h;
  document.querySelectorAll('[data-scroll]').forEach(e=>{if(keep[e.dataset.scroll])e.scrollTop=keep[e.dataset.scroll];});
}

/* ======================= ACTIONS ======================= */
const A={
  go:e=>{S.page=e.dataset.pg;S.whoOpen=false;},
  who:()=>{S.whoOpen=!S.whoOpen;},
  as:e=>{S.me=e.dataset.id;S.whoOpen=false;S.drawer=null;S.modal=null;toast('Now viewing as '+esc(me().name));},
  menu:e=>{S.menu=S.menu===e.dataset.id?null:e.dataset.id;},
  open:e=>{S.pid=e.dataset.id;S.page='project';S.ptab='recipe';},
  ptab:e=>{S.ptab=e.dataset.t;},
  stub:e=>{if(e.dataset.m)toast(e.dataset.m);},
  close:()=>{S.drawer=null;},
  mclose:()=>{S.modal=null;},

  /* projects */
  newProject:()=>{S.drawer={type:'project',mode:'add',name:'',desc:'',cams:['Camera 1'],vars:[],classes:[],creator:S.me,members:[],uf:{plant:'',team:'',q:''}};},
  editProject:e=>{const p=P(e.dataset.id);S.drawer={type:'project',mode:'edit',pid:p.id,name:p.name,desc:p.desc,cams:[...p.cams],vars:[...p.vars],classes:[...p.classes],creator:p.createdBy,members:[...p.members],uf:{plant:'',team:'',q:''}};},
  access:e=>{const p=P(e.dataset.id);S.drawer={type:'project',mode:'access',pid:p.id,name:p.name,creator:p.createdBy,members:[...p.members],uf:{plant:'',team:'',q:''}};},
  pickUser:e=>{const d=S.drawer,id=e.dataset.id;d.members=d.members.includes(id)?d.members.filter(x=>x!==id):[...d.members,id];},
  rmChip:e=>{S.drawer[e.dataset.k].splice(+e.dataset.i,1);},
  saveProject:()=>{const d=S.drawer;
    if(d.mode!=='access'&&!d.name.trim()){d.err=true;return;}
    if(d.mode==='add'){const mem=[...new Set([...d.members,S.me])];D.projects.unshift({id:nid('pr'),name:d.name.trim(),desc:d.desc.trim(),createdBy:S.me,createdAt:'Oct 19, 2026',members:mem,cams:d.cams,vars:d.vars,classes:d.classes,recipes:[],datasets:[],models:[],instances:[]});toast('Project created');}
    else{const p=P(d.pid);if(d.mode==='edit'){p.name=d.name.trim();p.desc=d.desc.trim();p.cams=d.cams;p.vars=d.vars;p.classes=d.classes;}
      p.members=d.members;if(p.createdBy&&!p.members.includes(p.createdBy))p.members.push(p.createdBy);toast(d.mode==='access'?'Project access updated':'Project updated');}
    S.drawer=null;},
  delProject:e=>{const p=P(e.dataset.id);S.modal={title:'Confirmation Message',body:`Are you sure you want to delete the project <b>${esc(p.name)}</b>?`,ok:'Delete',onOk:()=>{D.projects=D.projects.filter(x=>x.id!==p.id);toast('Project deleted');}};},
  changeOrg:e=>{const p=P(e.dataset.id);S.modal={type:'org',title:'Move to another organisation',name:p.name,ok:'Move project',onOk:()=>{D.projects=D.projects.filter(x=>x.id!==p.id);toast(`${esc(p.name)} moved. Members removed and instances set to draft.`);}};},
  lic:()=>{S.modal={type:'lic',title:'Download Demo License',proj:'',inst:'',ok:'Download',onOk:()=>{const m=S.modal;if(!m.inst){m.err='Select an instance';return true;}const i=P(m.proj).instances.find(x=>x.id===m.inst);toast('Demo license downloaded for '+esc(i.name));}};},

  /* instances */
  newInst:()=>{const u=me();S.drawer={type:'inst',name:'',plant:isOA(u)?'':u.plant,team:isOA(u)?'':u.team};},
  saveInst:()=>{const d=S.drawer;if(!d.name.trim()||!d.plant||!d.team){d.err=true;return;}P(S.pid).instances.push({id:nid('i'),name:d.name.trim(),plant:d.plant,team:d.team,date:'Oct 19, 2026',valid:'Apr 19, 2027',iid:Math.random().toString(16).slice(2,8)});S.drawer=null;toast('Instance created');},
  moveInst:e=>{const i=P(S.pid).instances.find(x=>x.id===e.dataset.id);S.drawer={type:'move',iid:i.id,plant:i.plant||'',team:i.team||''};},
  saveMove:()=>{const d=S.drawer;if(!d.plant||!d.team){d.err=true;return;}const i=P(S.pid).instances.find(x=>x.id===d.iid);const was=isDraft(i);i.plant=d.plant;i.team=d.team;S.drawer=null;toast(was?'Plant and team assigned. IDs updated everywhere, including Edge.':'Instance moved. IDs updated everywhere, including Edge.');},
  delInst:e=>{const p=P(S.pid);const i=p.instances.find(x=>x.id===e.dataset.id);S.modal={title:'Confirmation Message',body:`Are you sure you want to delete the instance <b>${esc(i.name)}</b>?`,ok:'Delete',onOk:()=>{p.instances=p.instances.filter(x=>x.id!==i.id);toast('Instance deleted');}};},

  /* plants & teams */
  addPT:e=>{const kind=e.dataset.k;const one=kind==='plants'?'Plant':'Team';S.modal={type:'pt',kind,one,title:'Add '+one,ok:'Add',val:'',onOk:()=>{const m=S.modal;const v=(m.val||'').trim();const arr=kind==='plants'?D.plants:D.teams;
    if(!v){m.err=`Enter a ${one.toLowerCase()} name`;return true;}
    if(arr.some(x=>x.name.toLowerCase()===v.toLowerCase())){m.err=`A ${one.toLowerCase()} named ${v} already exists.`;return true;}
    arr.push({id:nid(kind[0]),name:v});toast(one+' added');}};},

  /* users */
  newUser:()=>{const a=me();S.drawer={type:'user',id:null,name:'',email:'',phone:'',plant:userMgr(a)==='plant'?a.plant:'',team:'',roles:[],x:{edge:false,lic:false,manual:canGiveX('manual',a)},status:'Invited'};},
  editUser:e=>{const t=U(e.dataset.id);S.drawer={type:'user',id:t.id,name:t.name,email:t.email,phone:t.phone,plant:t.plant||'',team:t.team||'',roles:[...t.roles],x:{...t.x},status:t.status};},
  pickRole:e=>{const d=S.drawer,id=e.dataset.id;d.roles=d.roles.includes(id)?d.roles.filter(x=>x!==id):[...d.roles,id];},
  pickX:e=>{const d=S.drawer;d.x[e.dataset.id]=!d.x[e.dataset.id];},
  pickStatus:()=>{const d=S.drawer;d.status=d.status==='Active'?'Inactive':'Active';},
  saveUser:()=>{const d=S.drawer;const oa=d.roles.includes('org_admin');const errs={};
    if(d.id){const t0=U(d.id);if(lastOA(t0)&&(!oa||d.status==='Inactive')){S.modal={title:'Can’t remove the last Org Admin',body:'Make someone else an Org Admin first.'};return;}}
    if(!d.name.trim())errs.name='Name is required';
    if(!d.id){const em=d.email.trim();if(!/^\S+@\S+\.\S+$/.test(em))errs.email='Enter a valid email id';else if(D.users.some(u=>u.email.toLowerCase()===em.toLowerCase()))errs.email='A user with this email already exists.';}
    if(!oa&&!d.plant)errs.plant='Required';if(!oa&&!d.team)errs.team='Required';
    if(Object.keys(errs).length){d.err=errs;return;}
    if(d.id){const t=U(d.id);
      Object.assign(t,{name:d.name.trim(),phone:d.phone,plant:oa?null:d.plant,team:oa?null:d.team,roles:[...d.roles],x:{...d.x},status:t.status==='Invited'?'Invited':d.status});
      toast('User successfully updated!'+(t.roles.length?'':' They are now a Viewer.'));}
    else{const em=d.email.trim();D.users.splice(D.users.length-1,0,{id:nid('u'),name:d.name.trim(),email:em,phone:d.phone,plant:oa?null:d.plant,team:oa?null:d.team,roles:[...d.roles],x:{...d.x},status:'Invited'});toast('Invitation sent to ['+esc(em)+']');}
    S.drawer=null;},
  setStatus:e=>{const t=U(e.dataset.id);const s=e.dataset.s;
    if(s==='Inactive'&&lastOA(t)){S.modal={title:'Can’t deactivate the last Org Admin',body:'Make someone else an Org Admin first.'};return;}
    if(s==='Inactive'){S.modal={title:'Confirmation Message',body:`Are you sure you want to deactivate [${esc(t.name)}]? They will be logged out and keep their project memberships.`,ok:'Deactivate',onOk:()=>{t.status='Inactive';toast('User deactivated');}};}
    else{t.status='Active';toast('User activated');}},
  delUser:e=>{const t=U(e.dataset.id);
    if(lastOA(t)){S.modal={title:'Can’t delete the last Org Admin',body:'Make someone else an Org Admin first.'};return;}
    S.modal={title:'Delete user',body:`Delete <b>${esc(t.name)}</b>? This can’t be undone.<br><span style="font-size:13px;color:var(--g500)">They’ll be removed from every project. Their work stays.</span>`,ok:'Delete',onOk:()=>{D.deleted[t.id]=t.name;D.users=D.users.filter(x=>x.id!==t.id);D.projects.forEach(p=>p.members=p.members.filter(x=>x!==t.id));toast('User deleted');}};},

  /* roles */
  newRole:()=>{const p=emptyP();S.drawer={type:'role',mode:'add',step:0,id:null,name:'',desc:'',perms:p,base:JSON.stringify(['','',p])};},
  viewRole:e=>{const r=R(e.dataset.id);S.drawer={type:'role',mode:'view',step:1,id:r.id,name:r.name,desc:r.desc,perms:rolePerms(r),base:''};},
  editRole:e=>{const r=R(e.dataset.id);const p=JSON.parse(JSON.stringify(r.perms));S.drawer={type:'role',mode:'edit',step:0,id:r.id,name:r.name,desc:r.desc,perms:p,base:JSON.stringify([r.name,r.desc,p])};},
  rstep:e=>{const d=S.drawer;const s=+e.dataset.s;if(s===1&&d.mode!=='view'&&!(d.name.trim()&&d.desc.trim()))return;d.step=s;},
  rnext:()=>{S.drawer.step=1;},rback:()=>{S.drawer.step=0;},
  pc:e=>{const d=S.drawer;const a=e.dataset.ar,c=e.dataset.c;const ar=AREAS.find(x=>x.id===a);const v=!d.perms[a][c];if(ar.linked)ar.cols.forEach(k=>d.perms[a][k]=v);else d.perms[a][c]=v;},
  saveRole:()=>{const d=S.drawer;const rec={name:d.name.trim(),desc:d.desc.trim(),perms:d.perms};
    if(d.mode==='edit'){Object.assign(R(d.id),rec);toast('Role saved');}else{D.roles.push({id:nid('c_'),type:'custom',...rec});toast('Role created');}S.drawer=null;},
  delRole:e=>{const r=R(e.dataset.id);const us=customers().filter(u=>u.roles.includes(r.id));
    if(us.length){S.modal={title:'Role is in use',body:`<b>${esc(r.name)}</b> is assigned to ${us.length} user${us.length>1?'s':''} (${us.map(u=>esc(u.name)+(u.status==='Inactive'?' – inactive':'')).join(', ')}). Remove it from them before deleting.`};return;}
    S.modal={title:'Confirmation Message',body:`Are you sure you want to delete the role <b>${esc(r.name)}</b>? This can’t be undone.`,ok:'Delete',onOk:()=>{D.roles=D.roles.filter(x=>x.id!==r.id);toast('Role deleted');}};},
};

/* ======================= EVENTS ======================= */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]');
  if(!t){if(S.menu||S.whoOpen){S.menu=null;S.whoOpen=false;render();}return;}
  if(t.tagName==='SELECT'||t.tagName==='INPUT')return;
  const a=t.dataset.a;
  if(a==='mok'){const m=S.modal;const keep=m&&m.onOk?m.onOk():false;if(keep!==true)S.modal=null;render();return;}
  if(!A[a])return;
  if(a!=='menu'&&a!=='who')S.menu=null;
  A[a](t);render();
});
function rerenderKeep(sel,t){const pos=t.selectionStart;render();const n=document.querySelector(sel);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}
document.addEventListener('input',ev=>{
  const t=ev.target;const d=S.drawer;
  if(d&&t.dataset.f&&t.tagName==='INPUT'&&!t.dataset.a){d[t.dataset.f]=t.value;if(d.type==='role')rerenderKeep(`[data-f="${t.dataset.f}"]`,t);return;}
  if(d&&t.hasAttribute('data-pq')){d.uf.q=t.value;rerenderKeep('[data-pq]',t);return;}
  if(t.hasAttribute('data-uq')){S.uf.q=t.value;rerenderKeep('[data-uq]',t);return;}
  if(S.modal&&t.id==='mName'){S.modal.val=t.value;}
});
document.addEventListener('change',ev=>{
  const t=ev.target;const d=S.drawer;
  if(t.dataset.a==='dsel'&&d){d[t.dataset.f]=t.value;render();return;}
  if(t.dataset.a==='pf'&&d){d.uf[t.dataset.f]=t.value;render();return;}
  if(t.dataset.a==='uf'){S.uf[t.dataset.f]=t.value;render();return;}
  if(t.dataset.a==='msel'&&S.modal){S.modal[t.dataset.f]=t.value;S.modal.err='';if(t.dataset.f==='proj')S.modal.inst='';render();return;}
  if(t.dataset.a==='orgsw'){toast('Switching to '+esc(t.value)+'. The prototype stays in '+D.org+'.');render();}
});
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(ev.key==='Enter'&&t.dataset&&t.dataset.chip&&S.drawer){ev.preventDefault();const v=t.value.trim();const k=t.dataset.chip;if(v){const arr=S.drawer[k];if(!arr.some(x=>x.toLowerCase()===v.toLowerCase()))arr.push(v);}render();const n=document.querySelector(`[data-chip="${k}"]`);if(n)n.focus();return;}
  if(ev.key==='Enter'&&t.id==='mName'){const b=document.querySelector('[data-a="mok"]');if(b)b.click();return;}
  if(ev.key==='Escape'){S.drawer=null;S.modal=null;S.menu=null;S.whoOpen=false;render();}
});
document.addEventListener('mouseover',ev=>{
  const t=ev.target.closest('[data-tip]');const tt=$('tt');
  if(!t){tt.hidden=true;return;}
  tt.textContent=t.dataset.tip;tt.hidden=false;
  const r=t.getBoundingClientRect();const w=tt.offsetWidth,h=tt.offsetHeight;
  let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(x,innerWidth-w-8));
  let y=r.top-h-8;if(y<8)y=r.bottom+8;
  tt.style.left=x+'px';tt.style.top=y+'px';
});
document.addEventListener('scroll',()=>{$('tt').hidden=true;},true);
render();
</script>
